name: company-pages

on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - 'assets/org-chart.svg'
      - 'skills/**'
      - 'agents/**'
      - 'bin/company'
      - 'commands/company.md'
      - 'scripts/**'
      - 'tests/test_project.py'
      - 'tests/test_company.js'
      - 'tests/test_harness.js'
      - 'tests/test_missions.py'
      - 'tests/test_studio.js'
      - '.github/workflows/studio-pages.yml'
  workflow_dispatch:

concurrency:
  group: studio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          package-manager-cache: false

      - name: Project state and native launcher tests
        run: python -m unittest discover -s tests -p test_project.py

      - name: Mission compiler tests
        run: python -m unittest discover -s tests -p test_missions.py

      - name: Company experience tests
        run: node --test tests/test_company.js tests/test_harness.js

      - name: Studio tests
        run: node --test tests/test_studio.js

      - name: Company dataset is current
        run: python scripts/build_company.py --check

      - name: Studio dataset is current
        run: python scripts/build_studio.py --check

      - name: Stage only public company and recipe files
        shell: bash
        run: |
          set -euo pipefail
          test ! -L studio
          mkdir _site
          for file in index.html company.css company.js company-data.js company-team.png harness.js missions.html social-preview.png favicon.svg studio.css studio.js missions.js; do
            test -f "studio/$file"
            test ! -L "studio/$file"
            cp "studio/$file" "_site/$file"
          done
          test ! -L assets
          test -f assets/org-chart.svg
          test ! -L assets/org-chart.svg
          cp assets/org-chart.svg _site/org-chart.svg

      - name: Upload company artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy company
        id: deployment
        uses: actions/deploy-pages@v4
